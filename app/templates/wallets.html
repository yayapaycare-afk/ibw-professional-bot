{% extends 'base.html' %}{% block content %}<h1>Wallet Services</h1><div class='card'><h3>Add Wallet</h3><form method='post' action='/admin/wallets/add'><input name='name' placeholder='Wallet name' required><input type='number' name='total_fee' placeholder='Total fee' required><input type='number' min='1' max='100' name='initial_percent' placeholder='Initial payment %' required><button>Add Wallet</button></form></div>{% for w in wallets %}<div class='card'><b>{{w.name}}</b> — ₹{{w.total_fee}} — {{w.initial_percent}}% <a class='btn' style='float:right' href='/admin/wallet/{{w.id}}'>Manage</a></div>{% endfor %}{% endblock %}
