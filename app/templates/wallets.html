{% extends 'base.html' %}{% block title %}Wallets - IBW{% endblock %}{% block content %}<h1>Wallet Services</h1><div class="card"><h3>Add Wallet</h3><form method="post" action="/admin/wallets/add"><label>Wallet Name</label><input name="name" required><label>Total Fee</label><input type="number" min="0" name="total_fee" required><label>First Payment Percentage</label><input type="number" min="1" max="100" name="initial_percent" value="70" required><button>Add Wallet</button></form></div>{% for w in wallets %}<div class="card"><div class="actions" style="justify-content:space-between"><div><b>{{w.name}}</b><br><span class="muted">₹{{w.total_fee}} · First payment {{w.initial_percent}}% · {{'Active' if w.active else 'Inactive'}}</span></div><a class="btn" href="/admin/wallet/{{w.id}}">Manage</a></div></div>{% endfor %}{% endblock %}
