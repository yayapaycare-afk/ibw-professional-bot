<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBW Admin Login</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#17233f,#2c5ea8);min-height:100vh;display:grid;place-items:center}.box{width:min(92%,380px);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 50px #0004}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ccd4e0;border-radius:9px}button{width:100%;padding:12px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700}.error{color:#b42318;background:#feeceb;padding:9px;border-radius:8px}</style></head><body><form class="box" method="post"><h2>🏦 IBW Admin Login</h2><p>Secure browser dashboard</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<input name="username" placeholder="Username" autocomplete="username" required><input type="password" name="password" placeholder="Password" autocomplete="current-password" required><button>Login</button></form></body></html>
