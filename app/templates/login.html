<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>IBW Admin Login</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="theme-color" content="#14213d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IBW Admin">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;min-height:100dvh;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#17233f,#2c5ea8);display:flex;align-items:center;justify-content:center}
    .box{width:100%;max-width:380px;background:#fff;padding:28px 22px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    h2{margin:0 0 8px;color:#152033}p{color:#6c7890}
    input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccd4e0;border-radius:9px;font-size:16px;background:#fff}
    button{width:100%;padding:13px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .error{color:#b42318;background:#feeceb;padding:10px;border-radius:8px}
  </style>
</head>
<body>
  <form class="box" method="post" action="/login" autocomplete="on">
    <h2>🏦 IBW Admin Login</h2>
    <p>Secure Administration Panel</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Login</button>
  </form>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js", {updateViaCache: "none"}).catch(function () {});
      });
    }
  </script>
</body>
</html>
