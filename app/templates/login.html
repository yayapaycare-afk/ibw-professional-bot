<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBW Admin Login</title><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#14213d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IBW Admin"><link rel="apple-touch-icon" href="/static/icons/icon-192.png"><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#17233f,#2c5ea8);min-height:100vh;display:grid;place-items:center}.box{width:min(92%,380px);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 50px #0004}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ccd4e0;border-radius:9px}button{width:100%;padding:12px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700}.error{color:#b42318;background:#feeceb;padding:9px;border-radius:8px}</style></head><body><form class="box" method="post"><h2>🏦 IBW Admin Login</h2><p>Secure browser dashboard</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<input name="username" placeholder="Username" autocomplete="username" required><input type="password" name="password" placeholder="Password" autocomplete="current-password" required><button>Login</button></form><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch((error) => console.error("PWA service worker error:", error));
  });
}
</script></body></html>
