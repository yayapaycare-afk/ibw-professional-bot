{% extends 'base.html' %}{% block title %}Settings - IBW{% endblock %}{% block content %}<h1>Bot & Payment Settings</h1>{% if request.query_params.get('saved') %}<p class="success">Settings saved successfully.</p>{% endif %}<div class="card"><form method="post" enctype="multipart/form-data"><label>Working Hours</label><input name="working_hours" value="{{working_hours}}" required><label class="check"><input type="checkbox" name="service_available" {% if service_available %}checked{% endif %}> Service Available on start dashboard</label><label>Common Final Payment UPI ID</label><input name="final_upi_id" value="{{final_upi_id}}" placeholder="example@upi"><label>Common Final Payment Banking Name</label><input name="final_banking_name" value="{{final_banking_name}}" placeholder="Name shown in UPI app"><label>Common Final Payment QR</label><input type="file" name="final_qr" accept="image/*">{% if final_qr_file %}<p class="muted">A final QR is currently configured.</p>{% endif %}<button>Save Settings</button></form></div>{% endblock %}
