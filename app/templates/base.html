<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}IBW Admin{% endblock %}</title><link rel="manifest" href="/static/manifest.webmanifest"><meta name="theme-color" content="#14213d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IBW Admin"><link rel="apple-touch-icon" href="/static/icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#152033}nav{position:sticky;top:0;z-index:10;background:#14213d;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:18px;overflow-x:auto}nav b,nav a{white-space:nowrap}nav a{color:#fff;text-decoration:none}.wrap{max-width:1180px;margin:0 auto;padding:22px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #18243b12}.stat{font-size:32px;font-weight:700;margin:0}.muted{color:#6c7890}.success{background:#e9f8ef;color:#19733d;padding:10px;border-radius:9px}.warning{background:#fff5df;color:#8a5b00;padding:10px;border-radius:9px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #cad3e1;border-radius:9px;background:#fff}button,.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;background:#1769e0;color:#fff;text-decoration:none;cursor:pointer}.danger{background:#c83232}.secondary{background:#64748b}.green{background:#16834b}table{width:100%;min-width:700px;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6eaf0;vertical-align:top}.table-wrap{overflow-x:auto}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf3ff;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}label.check{display:flex;gap:8px;align-items:center;margin:8px 0}label.check input{width:auto;margin:0}@media(max-width:600px){.wrap{padding:14px 9px}.card{padding:14px;border-radius:12px}h1{font-size:24px}}
.danger-zone{border:1px solid #fecaca;background:#fff7f7}.danger{background:#b91c1c!important}.warning{padding:10px;border-radius:8px;background:#fff7d6;color:#7c5700}</style></head><body><nav><b>🏦 IBW Admin</b><a href="/admin">Dashboard</a><a href="/admin/wallets">Wallets</a><a href="/admin/settings">Settings</a><a href="/logout">Logout</a></nav><main class="wrap">{% block content %}{% endblock %}</main><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js").catch((error) => console.error("PWA service worker error:", error));
  });
}
</script></body></html>
