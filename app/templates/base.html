<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IBW Admin Panel{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        nav {
            background: #172033;
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            overflow-x: auto;
        }

        nav strong,
        nav a {
            white-space: nowrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .wrap {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px 14px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 3px 16px rgba(0, 0, 0, 0.07);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .stat-number {
            margin: 0;
            font-size: 30px;
        }

        .stat-label {
            margin: 6px 0 0;
            color: #687386;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 12px;
            border: 1px solid #ccd3df;
            border-radius: 8px;
        }

        button,
        .btn {
            display: inline-block;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            background: #1f6feb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 11px;
            border-bottom: 1px solid #e5e9f0;
            text-align: left;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .muted {
            color: #687386;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #eef3ff;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .wrap {
                padding: 14px 10px;
            }

            .card {
                border-radius: 12px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <strong>IBW Admin</strong>
        <a href="/admin">Dashboard</a>
        <a href="/admin/wallets">Wallets</a>
        <a href="/logout">Logout</a>
    </nav>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
